<style>
  :where(a[aria-current="page"]) { border-bottom: 2px solid rgba(255,255,255,.9); }
  nav a { transition: opacity .15s ease; } nav a:hover { opacity: .8; }
</style>

<script>
  (() => {
    const header = document.currentScript?.closest('header') || document;
    const btn      = header.querySelector('#menuBtn');
    const dlg      = header.querySelector('#mobileMenu');
    if (!btn || !dlg) return;

    if (dlg.parentElement !== document.body) {
      document.body.appendChild(dlg);
    }

    const panel    = dlg.querySelector('[data-panel]');
    const overlay  = dlg.querySelector('[data-overlay]');
    const closeBtn = dlg.querySelector('#closeBtn');
    const links    = dlg.querySelectorAll('nav[aria-label="Mobile"] a');

    const lockScroll = (v) => { document.documentElement.style.overflow = v ? 'hidden' : ''; };

    function openMenu() {
      dlg.classList.remove('hidden');
      requestAnimationFrame(() => {
        panel.classList.remove('translate-x-full');
        btn.setAttribute('aria-expanded', 'true');
        lockScroll(true);
      });
    }
    function closeMenu() {
      panel.classList.add('translate-x-full');
      btn.setAttribute('aria-expanded', 'false');
      lockScroll(false);
      setTimeout(() => dlg.classList.add('hidden'), 200);
    }

    btn.addEventListener('click', openMenu);
    overlay && overlay.addEventListener('click', closeMenu);
    closeBtn && closeBtn.addEventListener('click', closeMenu);
    links.forEach(a => a.addEventListener('click', closeMenu));
    window.addEventListener('keydown', e => { if (e.key === 'Escape' && !dlg.classList.contains('hidden')) closeMenu(); });

    const mq = window.matchMedia('(min-width: 768px)');
    mq.addEventListener?.('change', (ev) => { if (ev.matches) closeMenu(); });
  })();
</script>
