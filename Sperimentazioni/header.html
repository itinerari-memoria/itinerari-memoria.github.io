<header class="topbar" aria-label="Header">
  <nav class="nav-wrap" aria-label="Primary">
    <a href="index-nav.html" class="brand" aria-label="Home - Itinerari della Memoria 2.0">
      <img src="images/file.svg" alt="Itinerari della Memoria 2.0" width="36" height="36" loading="eager" />
      <span class="sr-only">Itinerari della Memoria 2.0</span>
    </a>

    <div class="nav-links">
      <a href="index-nav.html#sezione-progetto">Progetto</a>
      <a href="index-nav.html#sezione-itinerari">Itinerari</a>
      <a href="index-nav.html#sezione-telecamera">QR Code</a>
    </div>

    <button
      id="menuBtn"
      class="menu-btn"
      aria-label="Open menu"
      aria-controls="mobileMenu"
      aria-expanded="false"
    >
      <svg viewBox="0 0 24 24" class="menu-icon" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
  </nav>

  <!-- IMPORTANTE: hidden + translate-x-full -->
  <div id="mobileMenu" class="mobileMenu hidden" role="dialog" aria-modal="true">
    <div class="overlay" data-overlay></div>

    <div class="panel translate-x-full" data-panel>
      <div class="panel-head">
        <span class="panel-title">Itinerari della Memoria 2.0</span>
        <button id="closeBtn" class="close-btn" aria-label="Close menu">
          <svg viewBox="0 0 24 24" class="menu-icon" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <nav class="mobile-links" aria-label="Mobile">
        <a href="index-nav.html#sezione-progetto">Progetto</a>
        <a href="index-nav.html#sezione-itinerari">Itinerari</a>
        <a href="index-nav.html#sezione-telecamera">QR Code</a>
      </nav>

    </div>
  </div>
</header>

<style>
  :where(a[aria-current="page"]) { border-bottom: 2px solid rgba(255,255,255,.9); }
  nav a { transition: opacity .15s ease; } nav a:hover { opacity: .8; }
</style>

<script>
  (() => {
    const header = document.currentScript?.closest('header') || document;
    const btn      = header.querySelector('#menuBtn');
    const dlg      = header.querySelector('#mobileMenu');
    if (!btn || !dlg) return;

    if (dlg.parentElement !== document.body) {
      document.body.appendChild(dlg);
    }

    const panel    = dlg.querySelector('[data-panel]');
    const overlay  = dlg.querySelector('[data-overlay]');
    const closeBtn = dlg.querySelector('#closeBtn');
    const links    = dlg.querySelectorAll('nav[aria-label="Mobile"] a');

    const lockScroll = (v) => { document.documentElement.style.overflow = v ? 'hidden' : ''; };

    function openMenu() {
      dlg.classList.remove('hidden');
      requestAnimationFrame(() => {
        panel.classList.remove('translate-x-full');
        btn.setAttribute('aria-expanded', 'true');
        lockScroll(true);
      });
    }
    function closeMenu() {
      panel.classList.add('translate-x-full');
      btn.setAttribute('aria-expanded', 'false');
      lockScroll(false);
      setTimeout(() => dlg.classList.add('hidden'), 200);
    }

    btn.addEventListener('click', openMenu);
    overlay && overlay.addEventListener('click', closeMenu);
    closeBtn && closeBtn.addEventListener('click', closeMenu);
    links.forEach(a => a.addEventListener('click', closeMenu));
    window.addEventListener('keydown', e => { if (e.key === 'Escape' && !dlg.classList.contains('hidden')) closeMenu(); });

    const mq = window.matchMedia('(min-width: 768px)');
    mq.addEventListener?.('change', (ev) => { if (ev.matches) closeMenu(); });
  })();
</script>
